name: PostgreSQL repository and portable packages
on:
  push:
    branches: [main, 'codex/postgresql-windows-linux']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run offline checks
        shell: pwsh
        run: ./build.ps1 -JdkHome $env:JAVA_HOME
      - name: Build Windows and Linux archives
        shell: pwsh
        run: ./packaging/Build-PrivonymPortablePackages.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: privonym-portable
          path: |
            target/Privonym-Windows-*.zip
            target/Privonym-Linux-*.tar.gz
  linux-postgresql:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-postgresql-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: fixture-postgresql-password
      PRIVONYM_REPOSITORY_PASSWORD: fixture-postgresql-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: privonym-portable
          path: portable
      - name: Verify archive and initialize PostgreSQL
        run: |
          tar -xzf portable/Privonym-Linux-3.0.0-preview.tar.gz -C portable
          cd portable/Privonym-3.0.0-preview
          sha256sum -c SHA256SUMS
          sh -n privonym-server.sh
          sh -n privonym-init-postgresql.sh
          sh -n privonym-job.sh
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE privonym_migration_test_20261124_fresh TEMPLATE template0;'
          printf '%s\n' 'repository.url=jdbc:postgresql://localhost:5432/privonym_migration_test_20261124_fresh' 'repository.user=postgres' 'server.port=18080' > config/privonym.properties
          sh privonym-init-postgresql.sh
      - name: Exercise repository, rollback, resume and concurrent commit fence on Linux
        run: |
          mkdir test-classes
          javac --release 17 -cp 'portable/Privonym-3.0.0-preview/target/*' -d test-classes src/test/java/com/privonym/repository/oracle/PostgresqlRepositoryIntegrationCheck.java
          java -cp 'test-classes:portable/Privonym-3.0.0-preview/target/*:portable/Privonym-3.0.0-preview/lib/*' com.privonym.repository.oracle.PostgresqlRepositoryIntegrationCheck portable/Privonym-3.0.0-preview/config/privonym.properties
      - name: Start and stop the packaged Linux server
        run: |
          cd portable/Privonym-3.0.0-preview
          sh privonym-server.sh > server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/login > login.html; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat server.log; exit 1; fi
          grep -qi privonym login.html
